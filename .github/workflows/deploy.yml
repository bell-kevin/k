name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Roll the page on to the new day. 08:10 UTC is just after midnight in
    # America/Denver, the timezone the page is built for; change both together.
    # This job re-renders from the prebuilt calendar and fetches nothing.
    - cron: "10 8 * * *"
    # The same render again, six and a half hours later. GitHub runs a
    # schedule when it has capacity and is free to drop one outright: the
    # 08:10 above fired eleven hours late on 2026-08-27 and not at all on
    # 2026-08-28, and each time the no-JS page sat on the previous day until
    # someone noticed. A reader with JavaScript never sees it -- assets/app.js
    # re-renders from the calendar when data-built-for is not their today --
    # so the readers this site exists for are the only ones it fails. A second
    # attempt at an unrelated hour and minute is not a fix for that, but it is
    # a cheap one: --render-only writes the same bytes for the same day, and
    # the commit step below exits on "Nothing changed", so the run costs half
    # a minute and changes nothing when the first one worked. 14:40 UTC is
    # still the same Denver day in either half of the year -- 08:40 MDT,
    # 07:40 MST.
    - cron: "40 14 * * *"
    # And once more in the afternoon. Two attempts is thin cover when GitHub
    # is running both of them hours late rather than dropping just one: to the
    # end of August the 08:10 landed anywhere between 13:46 and 20:10, and on
    # 2026-08-31 it, the 14:40 and the Monday refetch were all skipped
    # outright, leaving Sunday's readings up until a dispatch was sent by
    # hand. A render is only safe between 07:00 UTC and midnight UTC -- before
    # 07:00 it is still the previous day in Denver in the winter half of the
    # year -- and three attempts spread over that window sit about six and a
    # half hours apart, so a morning GitHub swallows whole still rolls the
    # page over well before the evening. 20:35 UTC is 14:35 MDT, 13:35 MST.
    - cron: "35 20 * * *"
    # Twice a week, refetch to extend the calendar and pick up new content.
    # General Conference is held on a weekend and its talks are posted over the
    # following days, so checking Mondays and Thursdays picks up a new
    # conference within a few days of the text going up. The same run probes
    # for the next Come, Follow Me manual, so the January curriculum changeover
    # needs no edit either -- see resolve_cfm_manuals in tools/build_daily.py.
    - cron: "0 9 * * 1,4"
  workflow_dispatch:
    inputs:
      refetch:
        description: "Refetch from churchofjesuschrist.org (slow) instead of only re-rendering"
        type: boolean
        default: false

# Let the newest push win outright, and let everything else queue. A push is
# the only event whose earlier run is worthless once a later one exists; a
# scheduled render or a dispatch is the same render whenever it lands. And
# cancelling those cost the site its refetch: the 08:10 render fires hours
# late, the Monday and Thursday refetch starts at 09:00, and a render arriving
# while the refetch was mid-way killed it -- the run that extends the calendar
# and picks up a new conference, cancelled by the run that writes one date.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Each job gets the permissions it uses and no more. This one commits the
    # day's files back, so it writes contents; the deploy job holds the OIDC
    # token Pages is deployed with, and this one never sees it.
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The rules that decide a reading are regular expressions over English,
      # so they generalise in ways nobody intended. These cases are verses a
      # reader ruled on, and they run before anything is built or deployed --
      # they need no network, the verses are committed beside them.
      - name: Check the reading rules
        run: python tools/test_readings.py

      # The same, for the General Conference card. A paragraph that only makes
      # sense next to the one above it is the fault this catches -- "remember
      # that day in your life", with the day back in the paragraph before.
      - name: Check the quote rules
        run: python tools/test_quotes.py

      # A link has to open the verse where a reader can see it. The study
      # reader draws its toolbar over the top of the page and offsets nothing,
      # so where a link scrolls to is the site's problem to get right. This
      # holds the rule to the chapters it was ruled on and counts how much of
      # the calendar it is currently failing.
      - name: Check where the links land
        run: python tools/test_links.py

      # The arithmetic that turns a date into a day's readings -- which week a
      # title names, which chapters it assigns, which verse the index lands on.
      # Pure functions with no verses to commit, so these are cases in code.
      - name: Check the calendar arithmetic
        run: python tools/test_calendar.py

      # A full refetch is ~1,100 requests, and about 930 of them are chapters
      # of scripture, which do not change. So the response cache is carried
      # over from the last refetch rather than started cold, and only the
      # answers that can go stale are thrown away before the build: the
      # conference and manual pages, which are how a new conference or a new
      # year's manual is noticed at all. Bump the key if a chapter ever does
      # need refetching. The key never matches exactly, on purpose: that is
      # what makes the action save a fresh copy at the end of every run.
      - name: Restore the scripture cache
        if: github.event.schedule == '0 9 * * 1,4' || inputs.refetch
        uses: actions/cache@v6
        with:
          path: .cache
          key: study-api-v1-${{ github.run_id }}
          restore-keys: study-api-v1-

      - name: Forget the responses that can go stale
        if: github.event.schedule == '0 9 * * 1,4' || inputs.refetch
        run: |
          mkdir -p .cache
          find .cache -name '*.json.gz' ! -name 'scriptures_*' -delete
          echo "$(find .cache -name '*.json.gz' | wc -l) chapters kept"

      # The refetch runs only on the twice-weekly cron or when asked for.
      # Every other run just re-renders today's page from the calendar already
      # in the repository.
      - name: Refetch readings calendar
        if: github.event.schedule == '0 9 * * 1,4' || inputs.refetch
        run: python tools/build_daily.py --days 730

      - name: Render today's page
        if: github.event.schedule != '0 9 * * 1,4' && !inputs.refetch
        run: python tools/build_daily.py --render-only

      # The run above is the only one that writes links, so the calendar it
      # wrote is checked before it is committed or served -- the run before the
      # build could only ever audit the calendar of the run before it, which is
      # how a fortnight of clipped links went out green.
      - name: Check where the rebuilt links land
        if: github.event.schedule == '0 9 * * 1,4' || inputs.refetch
        run: python tools/test_links.py

      # Bookkeeping only: the deploy below uses the working tree either way, so
      # losing a push race must not cost us the deployment.
      - name: Commit refreshed files
        continue-on-error: true
        run: |
          # Speaker photos arrive and are pruned with the calendar, so they are
          # committed alongside it; --porcelain also sees ones git has not
          # tracked yet, which a plain diff would miss.
          if [ -z "$(git status --porcelain -- data index.html assets/speakers)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html assets/speakers
          git commit -m "Readings for $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      # Publish only what the site serves -- not .git, the build tooling or
      # the response cache.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data LICENSE _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
