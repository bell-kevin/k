name = "verse-render-pinger"
main = "worker.js"
compatibility_date = "2026-05-01"

# After the workflow's two morning attempts, not between them -- this is the
# one that runs when GitHub has already had two chances and taken neither. The
# workflow keeps a third at 20:35 UTC, behind this one, for the morning it is
# this worker that is broken. 16:25 UTC is 10:25 MDT and 09:25 MST, so it is
# the same Denver day the page is built for in either half of the year. A
# minute nobody else picks, for the same reason the workflow's own three are
# at :10, :40 and :35.
[triggers]
crons = ["25 16 * * *"]

[vars]
SITE_URL = "https://bell-kevin.github.io/verse/"
REPO = "bell-kevin/verse"
# The workflow's filename works as its id and survives a rename of the
# workflow's name: field, which the numeric id does not read as.
WORKFLOW = "deploy.yml"
BRANCH = "main"
# Must match tools/build_daily.py --timezone. Change both together.
TIMEZONE = "America/Denver"

# GITHUB_TOKEN is a secret, not a var. See README.md.
